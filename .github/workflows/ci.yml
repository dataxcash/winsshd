name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare config & users
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\ProgramData\winsshd | Out-Null
          Copy-Item config.example.toml C:\ProgramData\winsshd\config.toml
          $exe = ".\target\release\winsshd.exe"
          & $exe user add tester --password "Test123456"
          ssh-keygen -t ed25519 -f testkey -N ''
          & $exe key-add tester testkey.pub
          & $exe user list
          Copy-Item C:\ProgramData\winsshd\users.toml users_dump.toml

      - name: Install service & start
        shell: pwsh
        run: |
          $exe = ".\target\release\winsshd.exe"
          & $exe install
          & $exe start
          Start-Sleep -Seconds 2
          Get-Service WinSSHD | Format-List Name, Status, StartType

      - name: Wait for port 2222
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $c = New-Object Net.Sockets.TcpClient
              $c.Connect("127.0.0.1", 2222); $c.Close(); $ok = $true; break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) {
            Get-Content C:\ProgramData\winsshd\winsshd.log -ErrorAction SilentlyContinue
            throw "port 2222 never opened"
          }

      - name: Test exec (publickey)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $out = ssh -vv -o BatchMode=yes -o ConnectTimeout=10 `
                       -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL `
                       -o IdentitiesOnly=yes `
                       -i testkey -p 2222 tester@127.0.0.1 "echo EXEC_OK" 2>&1
          $out | Out-String | Set-Content exec_out.txt
          Get-Content exec_out.txt | Out-String | Write-Host
          if ("$out" -notmatch "EXEC_OK") { exit 1 }

      - name: Test password auth (Posh-SSH)
        timeout-minutes: 5
        shell: pwsh
        run: |
          Install-Module Posh-SSH -Force -Scope CurrentUser -ErrorAction Stop
          $pw = ConvertTo-SecureString "Test123456" -AsPlainText -Force
          $cred = New-Object PSCredential("tester", $pw)
          $s = New-SSHSession -ComputerName 127.0.0.1 -Port 2222 -Credential $cred -AcceptKey
          $r = Invoke-SSHCommand -SessionId ($s.SessionId) -Command "echo PASSWD_OK"
          $r.Output | Out-String | Set-Content passwd_out.txt
          Write-Host $r.Output
          Remove-SSHSession -SessionId ($s.SessionId) | Out-Null
          if ("$($r.Output)" -notmatch "PASSWD_OK") { exit 1 }

      - name: Test SFTP roundtrip
        timeout-minutes: 3
        shell: pwsh
        run: |
          "sftp-roundtrip-content" | Out-File -Encoding ascii up.txt
          "put up.txt`nls -l`nget up.txt down.txt`nbye" | Out-File -Encoding ascii sftp.bat
          sftp -o BatchMode=yes -o ConnectTimeout=10 `
               -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL `
               -o IdentitiesOnly=yes `
               -i testkey -P 2222 -b sftp.bat tester@127.0.0.1 2>&1 | `
               Tee-Object -Variable sftp_out
          $sftp_out | Out-String | Set-Content sftp_out.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $a = (Get-FileHash up.txt).Hash; $b = (Get-FileHash down.txt).Hash
          if ($a -ne $b) { throw "sftp roundtrip mismatch" }
          "SFTP_PASS" | Out-File sftp_ok.txt

      - name: Test interactive shell (PTY)
        timeout-minutes: 3
        continue-on-error: true
        shell: pwsh
        run: |
          "exit`n" | ssh -o BatchMode=yes -o ConnectTimeout=10 `
                       -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL `
                       -o IdentitiesOnly=yes `
                       -i testkey -p 2222 tester@127.0.0.1 2>&1 | `
                       Out-String | Set-Content shell_out.txt
          Get-Content shell_out.txt | Out-String | Write-Host

      - name: Service stop & uninstall
        shell: pwsh
        run: |
          $exe = ".\target\release\winsshd.exe"
          & $exe stop
          & $exe uninstall
          Start-Sleep -Seconds 1
          if (Get-Service WinSSHD -ErrorAction SilentlyContinue) { throw "service still exists" }

      - name: Publish diagnostics to diagnostics branch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          Copy-Item C:\ProgramData\winsshd\winsshd.log diagnostics\ -ErrorAction SilentlyContinue
          Copy-Item users_dump.toml diagnostics\ -ErrorAction SilentlyContinue
          Copy-Item exec_out.txt,passwd_out.txt,sftp_out.txt,shell_out.txt diagnostics\ -ErrorAction SilentlyContinue
          git config user.name "ci-bot"
          git config user.email "ci@localhost"
          git add -f diagnostics
          git commit -q -m "ci diagnostics [skip ci]" || Write-Host "nothing to commit"
          git push -q origin "HEAD:diagnostics" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
